version: '3.8'

services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: ai-tracker-postgres-dev
    environment:
      POSTGRES_USER: aitracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ai_tracker_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aitracker -d ai_tracker_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:15-alpine
    container_name: ai-tracker-postgres-test
    environment:
      POSTGRES_USER: aitracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ai_tracker_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aitracker -d ai_tracker_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  postgres_test_data:

